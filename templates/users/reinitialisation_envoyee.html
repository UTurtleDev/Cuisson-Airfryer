{% extends "base.html" %}

{% block titre %}Lien envoyé{% endblock %}

{% block contenu %}
    <div class="panneau panneau--centre">
        <h1 class="titre-panneau">Lien envoyé</h1>
        <p class="rappel">
            Si un compte existe avec cette adresse, un message contenant le lien de
            réinitialisation vient d'être envoyé. Pensez à vérifier les indésirables.
        </p>
        <p class="actions">
            <a class="btn btn-secondary" href="{% url 'users:connexion' %}">Retour à la connexion</a>
        </p>
    </div>
{% endblock %}
