{% extends "base.html" %}

{% block titre %}Changer mon mot de passe{% endblock %}

{% block contenu %}
    <div class="panneau">
        <h1 class="titre-panneau">Changer mon mot de passe</h1>
        <form method="post">
            {% csrf_token %}
            {% include "partiels/formulaire.html" with formulaire=form %}
            <p class="actions">
                <button type="submit" class="btn btn-primary">Valider</button>
                <a class="btn btn-ghost" href="{% url 'users:profil' %}">Annuler</a>
            </p>
        </form>
    </div>
{% endblock %}
